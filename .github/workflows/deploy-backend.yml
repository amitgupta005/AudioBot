name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

env:
  PROJECT_ID: black-moon-508816-a8
  REGION: asia-south1
  SERVICE: audiobot-backend
  IMAGE: asia-south1-docker.pkg.dev/black-moon-508816-a8/audiobot-repo/audiobot-backend

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/877038246752/locations/global/workloadIdentityPools/github-pool/providers/github-provider
          service_account: github-deployer@black-moon-508816-a8.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2

      - run: gcloud auth configure-docker asia-south1-docker.pkg.dev --quiet

      - name: Build & Push
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            ./backend
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.IMAGE }}:${{ github.sha }}
          env_vars: |
            DATABASE_URL=${{ secrets.DATABASE_URL }}
            GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}
            SECRET_KEY=${{ secrets.SECRET_KEY }}
            ENVIRONMENT=production
            VERTEX_AI_PROJECT=${{ env.PROJECT_ID }}
            VERTEX_AI_LOCATION=${{ env.REGION }}
            VERTEX_AI_MODEL_CHAT=gemini-2.5-flash
            VERTEX_AI_MODEL_REASONING=gemini-2.5-flash
            CORS_ALLOW_ORIGINS=${{ secrets.CORS_ALLOW_ORIGINS }}
            GCP_REPORTS_BUCKET=${{ secrets.GCP_REPORTS_BUCKET }}
            GCP_PROJECT_ID=${{ env.PROJECT_ID }}
