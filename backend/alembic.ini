[alembic]
script_location = migrations
prepend_sys_path = .
# The URL below is a placeholder. The actual database URL is injected
# at runtime by migrations/env.py from the DATABASE_URL environment variable.
sqlalchemy.url = postgresql://localhost/audiobot

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers = console
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
