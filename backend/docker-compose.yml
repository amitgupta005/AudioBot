services:

  backend:
    build: .
    container_name: audiobot-backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-audiobot}
      - SECRET_KEY=${SECRET_KEY:-dev-only-secret-key-change-me}
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - GOOGLE_APPLICATION_CREDENTIALS=/tmp/keys/adc.json
    volumes:
      - C:/Users/amit7/AppData/Roaming/gcloud/application_default_credentials.json:/tmp/keys/adc.json:ro
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: audiobot-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-audiobot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  nginx:
    image: nginx:latest
    container_name: audiobot-nginx
    ports:
      - "80:80"
    volumes:
      - ../frontend:/usr/share/nginx/html
      - ../nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  postgres_data:
