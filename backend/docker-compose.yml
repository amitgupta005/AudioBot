version: "3.9"

services:

  backend:
    build: ./backend
    container_name: audiobot-backend
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_MODEL=llama3.1
      - REDIS_HOST=redis
    depends_on:
      - redis
      - ollama

  redis:
    image: redis:7
    container_name: audiobot-redis
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama
    container_name: audiobot-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  nginx:
    image: nginx:latest
    container_name: audiobot-nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - backend

volumes:
  ollama-data:
