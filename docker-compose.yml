version: '3.9'

services:
  mongodb:
    image: mongo:7 # MongoDB doesn't have an official tiny 'alpine' version, so we must limit its logs/RAM instead
    container_name: audiobot-mongo
    restart: unless-stopped
    ports:
      - "2000:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: audiobot
    # Prevents log files from growing infinitely and eating disk space
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Caps RAM and CPU usage so it doesn't slow down your machine
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  redis:
    image: redis:7-alpine # This '-alpine' tag ensures you are using the smallest possible image (~30MB)
    container_name: audiobot-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: '0.25'
          memory: 128M

volumes:
  mongo-data:
  redis-data: